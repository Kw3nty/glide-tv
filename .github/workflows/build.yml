name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Код могли залить с Windows: там у gradlew нет флага «исполняемый»
      - run: chmod +x gradlew

      - name: Lint (NewApi — защита Android 5–6 от вызовов новых API)
        run: ./gradlew :app:lintDebug

      - name: Debug APK
        run: ./gradlew :app:assembleDebug -Pglide.updateRepo=${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: glide-tv-debug
          path: app/build/outputs/apk/debug/*.apk

      # Релиз: только для тегов vX.Y.Z и только если в секретах есть ключ подписи
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.GLIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Нет секрета GLIDE_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GLIDE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GLIDE_KEYSTORE_PASSWORD: ${{ secrets.GLIDE_KEYSTORE_PASSWORD }}
          GLIDE_KEY_ALIAS: ${{ secrets.GLIDE_KEY_ALIAS }}
          GLIDE_KEY_PASSWORD: ${{ secrets.GLIDE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -Pglide.updateRepo=${{ github.repository }}
          cp app/build/outputs/apk/release/app-release.apk "glide-tv-${GITHUB_REF_NAME}-release.apk"
          sha256sum glide-tv-*-release.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glide-tv-*-release.apk
            SHA256SUMS.txt
          generate_release_notes: true
