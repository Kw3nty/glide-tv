[versions]
agp = "8.9.3"
kotlin = "2.1.21"
coroutines = "1.10.2"
libadb = "3.1.1"
bouncycastle = "1.81"
hiddenapibypass = "6.1"
# zxing 3.4+ требует API 24; 3.3.0 — последняя версия, работающая на Android 5
zxing = "3.3.0"
junit = "4.13.2"

[libraries]
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
libadb = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
